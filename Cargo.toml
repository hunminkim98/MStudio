[workspace]
resolver = "2"
members = ["crates/mstudio-core", "crates/mstudio-io", "crates/mstudio-processing", "crates/mstudio-render", "crates/mstudio-report", "crates/mstudio-app", "crates/mstudio-py", "crates/spike"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["HunMin Kim <hunminkim98@gmail.com>"]
repository = "https://github.com/hunminkim98/MStudio"

[workspace.dependencies]
mstudio-core = { path = "crates/mstudio-core" }
mstudio-io = { path = "crates/mstudio-io" }
mstudio-processing = { path = "crates/mstudio-processing" }
mstudio-render = { path = "crates/mstudio-render" }
mstudio-report = { path = "crates/mstudio-report" }
minijinja = "2"
open = "5"
wgpu = "30"
eframe = { version = "0.36", features = ["wgpu"] }
egui_dock = "0.21"
egui_plot = "0.37"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
nalgebra = "0.35"
num-complex = "0.4"
criterion = { version = "0.8", default-features = false }
ndarray = "0.17"
ndarray-npy = "0.10"
rayon = "1.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
c3dio = "0.8"
tempfile = "3"

[profile.release]
opt-level = 3
debug = 1

[profile.dev.package."*"]
opt-level = 2
