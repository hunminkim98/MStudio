[workspace]
resolver = "2"
members = ["crates/mstudio-core", "crates/mstudio-io", "crates/mstudio-processing", "crates/spike"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["HunMin Kim <hunminkim98@gmail.com>"]
repository = "https://github.com/hunminkim98/MStudio"

[workspace.dependencies]
mstudio-core = { path = "crates/mstudio-core" }
mstudio-processing = { path = "crates/mstudio-processing" }
nalgebra = "0.35"
num-complex = "0.4"
criterion = { version = "0.8", default-features = false }
ndarray = "0.17"
ndarray-npy = "0.10"
rayon = "1.10"
thiserror = "2"
serde_json = "1"
c3dio = "0.8"
tempfile = "3"

[profile.release]
opt-level = 3
debug = 1

[profile.dev.package."*"]
opt-level = 2
