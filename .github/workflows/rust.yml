# Rust workspace CI (MStudio v2 migration, docs/CROSS_PLATFORM_PLAN.md).
# The Python app keeps its own workflow in continuous-integration.yml.

name: Rust (Win / macOS arm64 / Linux)

on:
  push:
    branches: [main, 'release/**', 'feature/**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon. Intel macOS (macos-13) is not built or
        # tested: the runner stayed queued through three consecutive runs without
        # ever being assigned, so it cannot gate a merge (docs/PHASE6_RESULTS.md).
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Linux system libraries (winit / rfd / headless Vulkan via lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: test
        run: cargo test --workspace --locked

      - name: release build (app + spike binaries)
        run: cargo build --release -p mstudio-app -p mstudio-spike --locked

  wheels:
    # Python bindings: build the wheel with maturin, install it, run the
    # bindings tests and the live parity check against the Python oracle.
    # Wheels are uploaded as workflow artifacts only (no publishing).
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # Apple Silicon only, as above

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: wheels

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Linux system libraries (winit / rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libgtk-3-dev

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --locked -m crates/mstudio-py/Cargo.toml --out dist

      - name: Install the wheel and the oracle's dependencies
        shell: bash
        run: |
          # The legacy package must not be installed: pip normalises
          # distribution names case-insensitively, so `MStudio` and `mstudio`
          # are one distribution and installing the former silently satisfies
          # the latter. check_parity.py imports the oracle from the source
          # tree instead (scripts/oracle_harness.py).
          python -m pip install pytest -r scripts/oracle-requirements.txt
          python -m pip install --no-index --find-links dist mstudio
          python -c "import mstudio; print(mstudio.__version__, mstudio.__file__)"

      - name: Bindings tests
        run: python -m pytest crates/mstudio-py/tests -q

      - name: Parity against the Python oracle
        run: python scripts/check_parity.py --json parity-${{ matrix.os }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: |
            dist/*.whl
            parity-${{ matrix.os }}.json
